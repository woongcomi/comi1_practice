# 시즌 경기 데이터(순위, 경기 상세)를 매일 조금씩 이어 받는다. 무료 플랜 하루 100회 중
# 60회를 쓴다 (이적 수집이 일요일에 약 30회를 쓰므로 합쳐도 한도 안).
# 이미 받은 경기는 건너뛰므로, 전부 받은 뒤에는 요청을 쓰지 않고 바로 끝난다.
name: Collect season

on:
  schedule:
    - cron: "30 0 * * *" # 매일 09:30 (한국 시간)
  workflow_dispatch:
    inputs:
      season:
        description: "시즌"
        default: "2024"
      budget:
        description: "최대 요청 수"
        default: "60"

permissions:
  contents: write

concurrency:
  group: data-commit

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Collect
        working-directory: backend
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m app.collect_season --season "${{ inputs.season || '2024' }}" --budget "${{ inputs.budget || '60' }}"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/seasons
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update season data"
          git pull --rebase
          git push
