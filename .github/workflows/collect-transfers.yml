# 매주 이적 데이터를 다시 받아 변경이 있으면 커밋한다. 커밋되면 Render가 자동으로 재배포한다.
# 필요: 저장소 Settings > Secrets and variables > Actions 에 API_FOOTBALL_KEY 등록
name: Collect transfers

on:
  schedule:
    - cron: "0 18 * * 0" # 매주 월요일 03:00 (한국 시간)
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Collect
        working-directory: backend
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m app.collect
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/transfers.json
          # 수집 스크립트는 내용이 같으면 파일을 건드리지 않으므로, 변경이 있을 때만 커밋된다
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update transfer data"
          git push
